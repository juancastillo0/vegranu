name: vegranu
description: A documentation site built with Jaspr
version: 0.0.1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  jaspr: ^0.23.0
  jaspr_content: ^0.5.2
  jaspr_router: ^0.8.2
  # Process strings 'meal-plans' -> 'Meal Plans', used for route titles
  recase: ^4.1.0

dev_dependencies:
  build_runner: ^2.4.15
  build_web_compilers: ^4.4.17
  jaspr_builder: ^0.23.0
  jaspr_lints: ^0.7.0
  lints: ^6.0.0

jaspr:
  mode: static
  port: 8083
