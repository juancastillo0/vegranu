name: vegranu
description: A documentation site built with Jaspr
version: 0.0.1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  jaspr: ^0.22.1
  jaspr_content: ^0.4.1
  jaspr_router: ^0.8.1
  # Process strings 'meal-plans' -> 'Meal Plans', used for route titles
  recase: ^4.1.0

dev_dependencies:
  build_runner: ^2.4.15
  jaspr_builder: ^0.22.1
  jaspr_lints: ^0.6.0
  lints: ^6.0.0

jaspr:
  mode: static
